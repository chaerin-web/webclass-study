<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수</title>
</head>
<body>
    <script>
        //alert()
        //console.log()
        //prompt()
        //Number()
        //function 함수는 사용자 정의 함수라고도 한다. 우리가 여태 쓰던 위에 있는 함수들은 표준 내장 함수이다.
        // function a(){
        //     alert('안녕하세요')
        // }
        function b(name,age){
            document.write(`<p>${name}님 안녕하세요</p>`)
            document.write(`<p>${name}님은 ${age}세시군요</p>`)
        }
        // // b 변수 안에 있는 name을 매개변수라고 함.
        b('유채린',24)
        // 실행하는 부분에 name에 들어간 내용은 인자라고 함.

        function c(person){
            document.write(`<p>${person[0]}님 반갑습니다.</p>`)
            document.write(`<p>${person[0]}님은 ${person[1]}세시군요.</p>`)
        }
        c(['유채린',24])

        function d(person){
            document.write(`<p>${person.name}님 반갑습니다.</p>`)
            document.write(`<p>${person.name}님은 ${person.age}세시군요.</p>`)
        }
        d({name:"유채린",age:24})

        function e(){
            alert('히히')
            return 3
            alert('헤헤')
        }
        // let result1 = e()
        // console.log(result1)
        function g(name){
            document.write(`<p>${name}님 좋은아침입니다.</p>`)
            return {na:name}
        }
        // let user = g('유채린')
        // alert(user.na)

        function getAver(score){
            return (score[0]+score[1]+score[2])/3
        }
        alert(getAver([90,80,70]))
</script>
</body>
</html>
