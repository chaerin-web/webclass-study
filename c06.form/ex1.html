<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제</title>
</head>
<body>
    <h1>CREATE YOUR ACCOUNT</h1>
    <form action="#">
        <div>
        <label for="userEmail">Email Address</label>
        <input type="text" id="userEmail" name="userEmail">
        </div>
        <div>
        <label for="confirmAddress">Confirm your Address</label>
        <input type="text" id="confirmAddress" name="confirmAddress">
        </div>
        <div>
        <label for="Residence">Country of Residence</label>
        <select name="Residence" id="Residence">
            <option value="alnad island">Aland Island</option>
            <option value="bahamas">Bahamas</option>
            <option value="china">China</option>
            <option value="denmark">Denmark</option>
            <option value="egypt">Egypt</option>
            <option value="france">France</option>
            <option value="united kindom">United Kingdom</option>
            <option value="korea" selected>Korea, Republic of</option>
        </select>
        </div>
        <div>
        <input type="checkbox" id="userAgree" name="userAgree">
        <label for="userAgree">I am 13 years of age or older and agree to the terms of the <em>Steam Subscriber Agreement</em> and the <em>Value Privacy Policy</em></label>
        </div>
        <button type="submit">Continue</button>
    </form>
</body>
</html>
