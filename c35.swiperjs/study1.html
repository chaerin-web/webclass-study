<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <style>
        .station1 {
            width: 700px;
            height: 350px;
            border: 1px solid red;
        }

        .station2 {
            width: 1200px;
            height: 800px;
            border: 1px solid blue;
        }

        .station2 .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div class="swiper station1">
        <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide">Slide 1</div>
            <div class="swiper-slide">Slide 2</div>
            <div class="swiper-slide">Slide 3</div>
            <div class="swiper-slide">Slide 4</div>
            <div class="swiper-slide">Slide 5</div>
        </div>
    </div>

    <div class="swiper station2">
        <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide"><img src="./img/김가온.png" alt="김가온사진"></div>
            <div class="swiper-slide"><img src="./img/김예림.png" alt="김예림사진"></div>
            <div class="swiper-slide"><img src="./img/김하경.png" alt="김하경사진"></div>
            <div class="swiper-slide"><img src="./img/김현아.png" alt="김현아사진"></div>
            <div class="swiper-slide"><img src="./img/박민주.png" alt="박민주사진"></div>
            <div class="swiper-slide"><img src="./img/유채린.png" alt="유채린사진"></div>
            <div class="swiper-slide"><img src="./img/정현진.png" alt="정현진사진"></div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>


    <script>
        const station1 = new Swiper('.station1', {
            loop: true,
            direction: 'vertical',
        });
        const station2 = new Swiper('.station2', {
            loop: true,
            slidesPerView: 1.2,
            autoplay: {
                delay: 2000
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        });
    </script>
</body>

</html>
