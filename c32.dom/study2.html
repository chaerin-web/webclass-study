<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태그의 속성 편집하기</title>
    <style>
        .b.on{
            background-color: red;
            color: #fff;
        }
    </style>
</head>
<body>
    <figure>
    <img src="./img/유채린.png" alt="유채린" class="a">
    <figcaption class="b">유채린</figcaption>
    </figure>
    <script>
        // 변수 불러올 때 let 보다 const를 많이 씀. 수가 변해야 하는 경우에는 const 안씀.
        const img = document.querySelector('.a');
        img.setAttribute('src','./img/정선민.png');
        // alert(img.getAttribute('src'));
        const figcaption = document.querySelector('.b');
        // alert(figcaption.textContent) 이건 그냥 변수에 들어간 내용 확인하는 것
        // figcaption.innerText = '정현진';
        figcaption.innerHTML = '<i>정선민</i>';
        figcaption.classList.add('on');
        figcaption.classList.remove('on');
    </script>

    <ul class="list">
        <li>1</li>
        <li class="me">2</li>
        <li>3</li>
        <li>4</li>
    </ul>

    <script>
        let me = document.querySelector('.me');
        me.parentElement.style.border = '2px solid red';
        me.nextElementSibling.style.color = 'blue';
        me.previousElementSibling.style.color = 'pink';
        console.log(me.parentElement.previousElementSibling);
        let list = document.querySelector('.list');
        let listTags = list.children
        listTags[1].style.color = 'red';
        me.parentElement.previousElementSibling.previousElementSibling.children[0].setAttribute('src','./img/정현진.png'); //체이닝 기법
    </script>
</body>
</html>
