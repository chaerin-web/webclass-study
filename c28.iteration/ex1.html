<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 명단</title>
    <script src="./js/classroom.js"></script>
    <link rel="stylesheet" href="./css/ex1.css">
</head>
<body>
    <h1>우리반 명단</h1>
    <ul class="classmate">
        <script>
            for( let i=0 ; i<classRoom.length ; i++){

                let hobbies = '';
                for(let j=0 ; j<classRoom[i][4].length ; j++){
                    hobbies = hobbies + `<span>#${classRoom[i][4][j]}</span>`
                }
            document.write(`<li>
            <figure>
                <img src="./img/${classRoom[i][5]}" alt="${classRoom[i][0]} 프사">
            </figure>
            <dl>
                <dt>이름</dt>
                <dd>${classRoom[i][0]}</dd>
                <dt>성별</dt>
                <dd>${classRoom[i][1]}</dd>
                <dt>나이</dt>
                <dd>${classRoom[i][2]}</dd>
                <dt>결혼</dt>
                <dd>${classRoom[i][3]?'기혼':'미혼'}</dd>
                <dt>취미</dt>
                <dd>
                    ${hobbies}
                </dd>
            </dl>
            </li>`)
            }
        </script>
    </ul>
</body>
</html>
