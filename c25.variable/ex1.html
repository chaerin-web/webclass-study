<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/ex1.css">
    <title>성적표</title>
</head>
<body>
    <script>
        let userName = prompt('당신의 이름을 입력해주세요')
        let scoreKo = Number(prompt('당신의 국어점수를 입력해주세요'))
        let scoreEn = Number(prompt('당신의 영어점수를 입력해주세요'))
        let scoreMath = Number(prompt('당신의 수학점수를 입력해주세요'))
        let scoreSc = Number(prompt('당신의 사회점수를 입력해주세요'))
        let scoreSum = scoreKo + scoreEn + scoreMath + scoreSc
        let scoreAver = (scoreSum / 4).toFixed(2)
        let grade = Number(scoreAver)>=90?'1등급':Number(scoreAver)>=80?'2등급':Number(scoreAver)>=70?'3등급':Number(scoreAver)>=60?'4등급':'5등급'
        console.log(grade)
        document.write(` <table border="1">
        <caption>${userName}님의 성적표</caption>
        <tr>
            <th>이름</th>
            <td>${userName}</td>
        </tr>
        <tr>
            <th>국어</th>
            <td>${scoreKo}점</td>
        </tr>
        <tr>
            <th>영어</th>
            <td>${scoreEn}점</td>
        </tr>
        <tr>
            <th>수학</th>
            <td>${scoreMath}점</td>
        </tr>
        <tr>
            <th>사회</th>
            <td>${scoreSc}점</td>
        </tr>
        <tr>
            <th>합계</th>
            <td>${scoreSum}점</td>
        </tr>
        <tr>
            <th>평균</th>
            <td>${scoreAver}점</td>
        </tr>
        <tr>
            <th>등급</th>
            <td>${grade}</td>
        </tr>
        </table>`)
    </script>
</body>
</html>
