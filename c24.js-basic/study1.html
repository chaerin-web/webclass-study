<head>

    <title>자바스크립트 기초</title>
</head>
<body>
    <script>
        // 자바스크립트 언어만 사용 가능한 영역
        console.log("ㅋㅋㅋ");
        console.log("반갑습니다. 유채린님");

        "유채린"
        '김현아'
        // `김하경`
        "유"+"채"+"린" // "유채린"
        console.log("웹디정선생".length);
        console.log("유"+"채"+"린");
        console.log("웹디정선생"[0]+"웹디정선생"[1]) // "웹디"
        "he's a doctor"
    
        console.log((100+20)/10)
        console.log(10%3)
        console.log(10**2)
        
        console.log("100"+10)

        console.log("100"**2)
        
        // prompt("이름이 무엇인가요?")

        // document.write('<h1>'+prompt('이름을 입력해주세요')+'님 반갑습니다.</h1>')
        document.write(`<h1>${prompt('이름을 입력해주세요.')}님 반갑습니다.</h1>`)
    </script>
    <h2>그래요 반갑습니다.</h2>
